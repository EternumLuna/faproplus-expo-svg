name: Build & Publish Public NPM Package

"on":
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Build Sprites & Compile TypeScript
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Publish to Public NPM
        run: npm publish --provenance --access public --no-git-checks --tag latest
